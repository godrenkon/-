name: Publish native release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  desktop:
    if: startsWith(github.event.head_commit.message, 'release:')
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows installer
            target: --win
            artifact: release/*.exe
          - os: macos-latest
            label: macOS disk image
            target: --mac
            artifact: release/*.dmg
          - os: ubuntu-latest
            label: Linux AppImage
            target: --linux
            artifact: release/*.AppImage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  android:
    if: startsWith(github.event.head_commit.message, 'release:')
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk "Suiram.RPG.Edit.$(node -p \"require('./package.json').version\").android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Android APK
          path: Suiram.RPG.Edit.*.android.apk
          if-no-files-found: error

  release:
    if: startsWith(github.event.head_commit.message, 'release:')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - id: version
        run: node -e "console.log('tag=v' + require('./package.json').version)" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          NOTES='Independent RPG creation software by Suiram Community.\n\n- Android APK\n- Windows installer\n- macOS DMG\n- Linux AppImage\n- Local browser storage, 100 official extensions, JSON import and export'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Suiram RPG Edit $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Suiram RPG Edit $TAG" --notes "$NOTES"
          fi
          find release-assets -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
