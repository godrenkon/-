name: Publish release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - id: version
        run: echo "tag=v$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
      - run: zip -qr Suiram-RPG-Edit-${{ steps.version.outputs.tag }}.zip dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Suiram-RPG-Edit-$TAG.zip" --clobber
            exit 0
          fi
          gh release create "$TAG" "Suiram-RPG-Edit-$TAG.zip" \
            --target "$GITHUB_SHA" \
            --title "Suiram RPG Edit $TAG" \
            --notes "Suiram Communityによる独立型RPG制作ソフトの初回リリース。\n\n- Base44非依存\n- ブラウザ内保存\n- 100個の公式拡張\n- テストプレイ・JSON入出力対応"
