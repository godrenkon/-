name: Replace repository

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace:
    if: github.event.head_commit.message == 'Stage RPG replacement v2 final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace repository contents
        shell: bash
        run: |
          set -euo pipefail
          cat .repo-replace-v2/p00 .repo-replace-v2/p01 .repo-replace-v2/p02 .repo-replace-v2/p03 .repo-replace-v2/p04 .repo-replace-v2/p05 .repo-replace-v2/p06 .repo-replace-v2/p07 .repo-replace-v2/p08 .repo-replace-v2/p09 .repo-replace-v2/p10 .repo-replace-v2/p11 .repo-replace-v2/p12 .repo-replace-v2/p13 .repo-replace-v2/p14 .repo-replace-v2/p15 .repo-replace-v2/p16 .repo-replace-v2/p17 .repo-replace-v2/p18 .repo-replace-v2/p19 .repo-replace-v2/p20 | base64 -d > /tmp/project.tar.xz
          echo "5028a4903379883b4af5ad94bfc0eb364e26e587a9fcffa295099f003f2b0075  /tmp/project.tar.xz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/project.tar.xz -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace repository with RPG Edit project"
          git push origin HEAD:main
