version: '3.8'

services:
  discord-web-engine:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    # ヘルスチェック
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
