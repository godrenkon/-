<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Web Engine</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- ローディング画面 -->
        <div id="loading" class="loading-screen">
            <div class="loader"></div>
            <p>接続中...</p>
        </div>

        <!-- メインコンテナ -->
        <div id="main-container" style="display: none;">
            <!-- サイドバー -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h1>Discord</h1>
                    <div class="bot-status">
                        <span class="status-indicator" id="status-indicator"></span>
                        <span id="bot-name">ボット接続中...</span>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>サーバー</h3>
                    <div id="guilds-list" class="guilds-list">
                        <div class="loading-text">サーバー読込中...</div>
                    </div>
                </div>

                <div class="sidebar-footer">
                    <button id="refresh-btn" class="btn-icon" title="更新">🔄</button>
                    <button id="settings-btn" class="btn-icon" title="設定">⚙️</button>
                </div>
            </aside>

            <!-- メインコンテンツ -->
            <main class="main-content">
                <!-- チャンネルヘッダー -->
                <div id="channel-header" class="channel-header" style="display: none;">
                    <div class="channel-info">
                        <h2># <span id="channel-name">チャンネル</span></h2>
                        <p id="channel-topic" class="channel-topic"></p>
                    </div>
                    <div class="channel-actions">
                        <button id="members-btn" class="btn-secondary">👥 メンバー</button>
                        <button id="call-btn" class="btn-secondary">📞 通話開始</button>
                        <span id="voice-status" class="voice-status"></span>
                    </div>
                </div>
                <div id="call-status" class="call-status" style="display: none;">📞 通話準備中...</div>
                <div id="call-streams" class="call-streams"></div>

                <div id="voice-panel" class="voice-panel" style="display: none;">
                    <div class="voice-panel-row">
                        <div>
                            <div id="voice-panel-status" class="voice-panel-status">未接続</div>
                            <div id="voice-panel-info" class="voice-panel-info"></div>
                        </div>
                        <div class="voice-panel-actions">
                            <button id="voice-panel-selfmute" class="btn-secondary">ミュート</button>
                            <button id="voice-panel-refresh" class="btn-secondary">更新</button>
                            <button id="voice-panel-leave" class="btn-secondary">退出</button>
                        </div>
                    </div>
                    <div id="voice-panel-members" class="voice-panel-members"></div>
                </div>

                <!-- チャンネルセレクト -->
                <div id="no-selection" class="no-selection">
                    <div class="empty-state">
                        <div class="icon">💬</div>
                        <h2>チャンネルを選択してください</h2>
                        <p>左側からサーバーとチャンネルを選んでメッセージを表示できます</p>
                    </div>
                </div>

                <div id="message-controls" class="message-controls" style="display: none;">
                    <button id="load-earlier-btn" class="btn-secondary">過去のメッセージを読み込む</button>
                    <button id="load-full-history-btn" class="btn-secondary">全履歴を読み込む</button>
                </div>

                <!-- メッセージエリア -->
                <div id="messages-container" class="messages-container" style="display: none;">
                    <div id="messages-list" class="messages-list">
                        <div class="loading-text">メッセージ読込中...</div>
                    </div>
                </div>

                <!-- メッセージ入力エリア -->
                <div id="input-area" class="input-area" style="display: none;">
                    <div id="reply-status" class="reply-status" style="display: none;">
                        <span id="reply-text"></span>
                        <button id="cancel-reply" type="button" class="btn-secondary">キャンセル</button>
                    </div>
                    <form id="message-form">
                        <input 
                            type="text" 
                            id="message-input" 
                            class="message-input" 
                            placeholder="メッセージを入力..."
                            autocomplete="off"
                        >
                        <button type="submit" class="btn-send">送信</button>
                    </form>
                    <div id="autocomplete-container" class="autocomplete-container" style="display: none;">
                        <ul id="autocomplete-list" class="autocomplete-list"></ul>
                    </div>
                </div>
            </main>

            <!-- メンバーパネル -->
            <aside id="members-panel" class="members-panel" style="display: none;">
                <div class="members-header">
                    <h3>メンバー</h3>
                    <button id="close-members-btn" class="btn-close">✕</button>
                </div>
                <div id="members-list" class="members-list">
                    <div class="loading-text">メンバー読込中...</div>
                </div>
            </aside>

            <div id="reaction-panel" class="reaction-panel" style="display: none;">
                <div class="reaction-panel-header">
                    <span>リアクション詳細</span>
                    <button id="reaction-panel-close" class="btn-close">✕</button>
                </div>
                <div id="reaction-panel-list" class="reaction-panel-list"></div>
            </div>
        </div>

        <!-- エラーモーダル -->
        <div id="error-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h2>エラー</h2>
                <p id="error-message"></p>
                <button id="error-close-btn" class="btn-primary">閉じる</button>
            </div>
        </div>

        <!-- 設定モーダル -->
        <div id="settings-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h2>設定</h2>
                <div class="settings-form">
                    <div class="form-group">
                        <label>ボットトークン:</label>
                        <input type="password" id="token-input" class="form-input" placeholder="トークンを入力">
                        <small>※ ブラウザに保存されます。重要な情報なので注意してください。</small>
                    </div>
                    <button id="save-token-btn" class="btn-primary">保存</button>
                    <button id="close-settings-btn" class="btn-secondary">閉じる</button>
                </div>
            </div>
        </div>

        <!-- プロフィールモーダル -->
        <div id="profile-modal" class="modal" style="display: none;">
            <div class="modal-content profile-modal-content">
                <button class="btn-close-modal" onclick="closeProfileModal()">✕</button>
                <div id="profile-content">
                    <div class="loading-text">読込中...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
