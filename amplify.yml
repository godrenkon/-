version: 1
frontend:
  phases:
    preBuild:
      commands:
        - 'test -n "$VITE_BASE44_APP_ID" || (echo "VITE_BASE44_APP_ID is required" && exit 1)'
        - 'test -n "$VITE_BASE44_APP_BASE_URL" || (echo "VITE_BASE44_APP_BASE_URL is required" && exit 1)'
        - npm ci
    build:
      commands:
        - npm test
        - npm run lint
        - npm run typecheck
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
